name: AI PR Gatekeeper

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

jobs:
  analyze-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SERVER_URL: ${{ secrets.SERVER_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff
        id: get_diff
        run: |
          git fetch origin ${{ github.base_ref }}
          # מוציא את ה-Diff בין ענף המקור לענף היעד (develop)
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD)
          
          # טיפול בבעיית תווים מיוחדים וירידות שורה עבור GitHub Actions Outputs
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 3. בדיקת זמינות השרת לפני שליחתPayload כבד
      - name: Check Server Health
        run: |
          set -euo pipefail
          echo "Checking server health at ${SERVER_URL}/ping"
          curl --silent --show-error --fail-with-body \
            --connect-timeout 15 \
            --max-time 60 \
            "${SERVER_URL}/ping"

      - name: Send PR Data to AI Server
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          CODE_DIFF: ${{ steps.get_diff.outputs.diff }}
        run: |
          set -euo pipefail

          echo "Sending PR #${{ github.event.pull_request.number }} to ${SERVER_URL}/analyze-pr"
          RESPONSE_FILE="$(mktemp)"
          CURL_EXIT=0

          PAYLOAD="$(jq -n \
            --arg owner "${{ github.repository_owner }}" \
            --arg repo "${{ github.event.repository.name }}" \
            --argjson prNumber "${{ github.event.pull_request.number }}" \
            --arg prTitle "$PR_TITLE" \
            --arg prDescription "$PR_BODY" \
            --arg codeDiff "$CODE_DIFF" \
            '{
              owner: $owner,
              repo: $repo,
              prNumber: $prNumber,
              prTitle: $prTitle,
              prDescription: $prDescription,
              codeDiff: $codeDiff
            }')"

          echo "PAYLOAD_BYTES=${#PAYLOAD}"

          set +e
          HTTP_CODE="$(curl --silent --show-error --fail-with-body \
            --connect-timeout 30 \
            --max-time 600 \
            --retry 2 \
            --retry-delay 3 \
            --retry-all-errors \
            -X POST "${SERVER_URL}/analyze-pr" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "Bypass-Tunnel-Reminder: true" \
            -w "%{http_code}" \
            -o "$RESPONSE_FILE" \
            -d "$PAYLOAD"
          )"
          CURL_EXIT=$?
          set -e

          echo "HTTP_STATUS=${HTTP_CODE:-<none>}"
          echo "CURL_EXIT=${CURL_EXIT}"
          echo "Response body:"
          cat "$RESPONSE_FILE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Request failed with HTTP status ${HTTP_CODE}"
            rm -f "$RESPONSE_FILE"
            exit 1
          fi

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "curl failed with exit code ${CURL_EXIT}"
            rm -f "$RESPONSE_FILE"
            exit "$CURL_EXIT"
          fi

          echo "### 🤖 AI Gatekeeper Analysis" >> $GITHUB_STEP_SUMMARY
          jq -r '.summary' "$RESPONSE_FILE" >> $GITHUB_STEP_SUMMARY

          rm -f "$RESPONSE_FILE"